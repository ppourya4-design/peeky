name: Smart Island (Peeky Island v2)

# Builds the vendored SmartIsland app under smart-island/ (branch smart-island only).
# Mirrors upstream's own CI (.github/workflows/build.yml in agupta07505/SmartIsland):
# JDK 17 (temurin), then lint + unit tests + the debug APK via the project's wrapper.
# The Telegram notify/send jobs from upstream are intentionally not carried over.

on:
  push:
    branches: [smart-island]
    paths:
      - 'smart-island/**'
      - '.github/workflows/smart-island.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: smart-island

jobs:
  build:
    name: Lint, test & debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run lint, tests, and debug build
        run: ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Peeky-Island-v2
          path: smart-island/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
